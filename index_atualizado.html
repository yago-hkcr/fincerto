:root{--vi-primary:#4ade80;--vi-primary-dark:#16a34a;--vi-bg:#030705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}

.vi-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(74,222,128,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 15%,transparent 75%);animation:vi-drift 30s linear infinite}

@keyframes vi-flash{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vi-p{position:fixed;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--vi-primary);box-shadow:0 0 10px var(--vi-primary);z-index:1000000;animation:vi-burst .95s cubic-bezier(.16,.84,.44,1) forwards}

#vi-site{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--vi-bg)}

<script>
(function(){
  var video=document.getElementById('vi-video'),play=document.getElementById('vi-play'),
      wrap=document.getElementById('vi-wrap'),frame=document.getElementById('vi-frame'),
      flash=document.getElementById('vi-flash'),
      seenKey='fincerto_video_seen';

  var alreadySeen=false;
  try {
    alreadySeen=localStorage.getItem(seenKey)==='1';
  } catch(e) {}

  if(alreadySeen){
    wrap.style.display='none';
    document.body.classList.remove('vi-active');
    return;
  }

  play.addEventListener('click',function(){
    video.muted=false;
    video.play().catch(function(){});
    play.classList.add('vi-hidden');
  });
  video.addEventListener('ended',function(){
    try {
      localStorage.setItem(seenKey,'1');
    } catch(e) {}
    frame.classList.add('vi-end');
    burst();
    flash.classList.add('vi-go');
    setTimeout(function(){wrap.classList.add('vi-hide');},260);
    setTimeout(function(){wrap.style.display='none';document.body.classList.remove('vi-active');},1750);
  });
  function burst(){
    for(var i=0;i<26;i++){
      var a=Math.random()*Math.PI*2,d=110+Math.random()*250,p=document.createElement('div');
      p.className='vi-p';
      p.style.setProperty('--tx',(Math.cos(a)*d)+'px');
      p.style.setProperty('--ty',(Math.sin(a)*d)+'px');
      p.style.animationDelay=(Math.random()*.15)+'s';
      document.body.appendChild(p);
      p.addEventListener('animationend',function(){this.remove();});
    }
  }
})();
</script>
